<!doctype html>
<html lang="pt">
  <head>
    <title>Twitter · Tailwind</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-black">
    <div class="max-w-[600px] mx-auto px-4 py-6 sm:py-8">
      <h1 class="text-2xl font-semibold mb-4 text-white">Meus Posts</h1>

      <!-- FORM -->
      <div class="flex gap-2 mb-5">
        <input
          type="text"
          placeholder="O que está pensando?"
          class="flex-1 bg-black text-white border border-gray-700 rounded-md px-3 py-2 text-base focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
        />
        <input
          type="button"
          value="Publicar"
          class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-5 py-2 rounded-md cursor-pointer transition-colors"
        />
      </div>

      <!-- FEED -->
      <ul class="space-y-2">
        <li
          class="bg-black text-white border border-gray-700 rounded-lg p-3 flex items-center justify-between gap-2"
        >
          <span class="text-base">Neymar na copa !!!</span>
          <button
            class="bg-red-600 hover:bg-red-700 text-white text-sm px-2.5 py-1 rounded-md transition-colors"
          >
            🗑️
          </button>
        </li>
      </ul>
    </div>
  </body>
</html>
